name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unidpp-gateway
    steps:
      # The crate path-depends on the sibling repositories
      # (../unidpp-core, ../unidpp-signatif, ../unidpp-cli, and the
      # dev-dependency ../unidpp-issuer); check them out side by
      # side, mirroring the family layout the manifests assume.
      - uses: actions/checkout@v4
        with:
          path: unidpp-gateway
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-core
          path: unidpp-core
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-signatif
          path: unidpp-signatif
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-cli
          path: unidpp-cli
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-issuer
          path: unidpp-issuer
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # fmt is scoped to this package (no --all): the formatting of
      # path dependencies belongs to their own repositories' CI.
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
